<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Blue background -->
  <rect width="500" height="500" fill="#0B2A8E"/>
  
  <g transform="translate(250,250) rotate(-12)">
    <!-- Left stroke (H left leg) - white -->
    <rect x="-130" y="-140" width="82" height="210" rx="41" ry="41" fill="white"/>
    
    <!-- Connecting arch (H crossbar) -->
    <path d="M -48 -10 Q -20 20 10 30" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Right stroke (exclamation bar) - light blue -->
    <rect x="10" y="-135" width="62" height="175" rx="31" ry="31" fill="#A8C4F0"/>
    
    <!-- Dot (exclamation dot) - white -->
    <circle cx="41" cy="95" r="38" fill="white"/>
  </g>
</svg>
