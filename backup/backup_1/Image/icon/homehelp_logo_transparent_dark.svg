<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Transparent background -->
  <g transform="translate(250,250) rotate(-12)">
    <!-- Left stroke (H left leg) - dark navy -->
    <rect x="-130" y="-140" width="82" height="210" rx="41" ry="41" fill="#0B2A8E"/>
    <!-- Connecting arch -->
    <path d="M -48 -10 Q -20 20 10 30" stroke="#0B2A8E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Right stroke (exclamation bar) - bright blue -->
    <rect x="10" y="-135" width="62" height="175" rx="31" ry="31" fill="#3A6FD8"/>
    <!-- Dot -->
    <circle cx="41" cy="95" r="38" fill="#0B2A8E"/>
  </g>
</svg>
